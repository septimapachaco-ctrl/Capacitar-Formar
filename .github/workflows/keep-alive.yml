name: Supabase keep-alive

on:
  schedule:
    # Todos los lunes y jueves a las 09:00 UTC — bien por debajo del
    # límite de 7 días de inactividad que pausa los proyectos free de
    # Supabase, sin generar tráfico innecesario.
    - cron: "0 9 * * 1,4"
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar una tabla real de Supabase
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" --fail \
            "https://vwgwjhbkchzcawfohimu.supabase.co/rest/v1/categories?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
