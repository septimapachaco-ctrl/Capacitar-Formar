function formatARS(value) {
  return new Intl.NumberFormat("es-AR", {
    style: "currency",
    currency: "ARS",
    maximumFractionDigits: 0,
  }).format(value || 0);
}

function slugify(text) {
  return text
    .toString()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/(^-|-$)+/g, "");
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

/**
 * Genera un link de WhatsApp (wa.me) con mensaje pre-cargado.
 * number: solo dígitos con código de país (ej: "5493876543210")
 */
function whatsappLink(number, message) {
  const cleanNumber = (number || "").replace(/\D/g, "");
  const text = encodeURIComponent(message || "Hola, quiero más información");
  return `https://wa.me/${cleanNumber}?text=${text}`;

const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/**
 * Revela con fade-up + delay escalonado los elementos con clase .reveal
 * a medida que entran en el viewport.
 */
function initScrollReveal() {
  const items = document.querySelectorAll(".reveal");
  if (items.length === 0) return;

  if (prefersReducedMotion || !("IntersectionObserver" in window)) {
    items.forEach((el) => el.classList.add("is-visible"));
    return;
  }

  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          observer.unobserve(entry.target);
        }
      });
    },
    { threshold: 0.15, rootMargin: "0px 0px -60px 0px" }
  );

  items.forEach((el) => observer.observe(el));
}

/**
 * Agrega la clase "scrolled" al header cuando el usuario baja la página,
 * para intensificar el fondo y la sombra (mejora de legibilidad).
 */
function initHeaderScroll() {
  const header = document.querySelector(".site-header");
  if (!header) return;

  function update() {
    header.classList.toggle("scrolled", window.scrollY > 12);
  }
  update();
  window.addEventListener("scroll", update, { passive: true });
}

/**
 * Anima números (ej: "+8", "100%") contando desde 0 hasta el valor final
 * cuando el elemento entra en pantalla. Requiere data-count-to="8" y
 * opcionalmente data-suffix="%".
 */
function initCounters() {
  const counters = document.querySelectorAll("[data-count-to]");
  if (counters.length === 0) return;

  if (prefersReducedMotion || !("IntersectionObserver" in window)) {
    counters.forEach((el) => {
      const to = Number(el.getAttribute("data-count-to"));
      const suffix = el.getAttribute("data-suffix") || "";
      el.textContent = `${to}${suffix}`;
    });
    return;
  }

  const observer = new IntersectionObserver(
    (entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        const el = entry.target;
        const to = Number(el.getAttribute("data-count-to"));
        const suffix = el.getAttribute("data-suffix") || "";
        const duration = 1200;
        const start = performance.now();

        function tick(now) {
          const progress = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3); // ease-out-cubic
          el.textContent = `${Math.round(to * eased)}${suffix}`;
          if (progress < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
        observer.unobserve(el);
      });
    },
    { threshold: 0.6 }
  );

  counters.forEach((el) => observer.observe(el));
}

/**
 * Efecto parallax sutil en los blobs del hero al mover el mouse
 * (solo desktop, respeta prefers-reduced-motion).
 */
function initHeroParallax() {
  if (prefersReducedMotion) return;
  const hero = document.querySelector(".hero");
  const blobs = document.querySelectorAll(".hero-blob");
  if (!hero || blobs.length === 0 || window.matchMedia("(max-width: 860px)").matches) return;

  hero.addEventListener("mousemove", (e) => {
    const { innerWidth, innerHeight } = window;
    const x = (e.clientX / innerWidth - 0.5) * 2;
    const y = (e.clientY / innerHeight - 0.5) * 2;

    blobs.forEach((blob, i) => {
      const strength = (i + 1) * 10;
      blob.style.transform = `translate(${x * strength}px, ${y * strength}px)`;
    });
  });
}

function initAllAnimations() {
  initScrollReveal();
  initHeaderScroll();
  initCounters();
  initHeroParallax();

const SITE_URL = "https://formarcapacitaciones.com";
let showPrices = false;

function getSlugFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get("slug");
}

async function fetchSiteContent() {
  const { data, error } = await supabase.from("site_content").select("data").eq("id", 1).single();
  if (error) throw error;
  return data?.data || {};
}

async function fetchCourse(slug) {
  const { data, error } = await supabase
    .from("courses")
    .select("*, categories(id, name, slug)")
    .eq("slug", slug)
    .eq("active", true)
    .single();
  if (error || !data) return null;
  return data;
}

async function fetchRelated(categoryId, currentId) {
  if (!categoryId) return [];
  const { data } = await supabase
    .from("courses")
    .select("*, categories(id, name, slug)")
    .eq("active", true)
    .eq("category_id", categoryId)
    .neq("id", currentId)
    .limit(3);
  return data ?? [];
}

function priceDisplay(course) {
  if (!showPrices) return `<span class="price-placeholder">$0000</span>`;
  return course.price > 0 ? formatARS(course.price) : "Consultar";
}

function applySEO(course) {
  const isAsync = /asincr/i.test(course.modality || "");
  const title = isAsync
    ? `${course.title} | Curso online asincrónico con certificación`
    : `${course.title} | Curso con validez nacional`;
  const description =
    course.short_description ||
    (isAsync
      ? `Formate en ${course.title} de forma online asincrónica: estudiá desde donde quieras, en el momento que puedas. Certificación con validez nacional e internacional.`
      : `Formate en ${course.title} con Formar Capacitaciones. Modalidad ${course.modality}. Certificación con validez nacional e internacional.`);
  const url = `${SITE_URL}/curso.html?slug=${encodeURIComponent(course.slug)}`;

  document.title = title;
  document.getElementById("page-title").textContent = title;
  document.getElementById("meta-description").setAttribute("content", description);
  document.getElementById("canonical-link").setAttribute("href", url);
  document.getElementById("og-title").setAttribute("content", title);
  document.getElementById("og-description").setAttribute("content", description);
  document.getElementById("twitter-title").setAttribute("content", title);
  document.getElementById("twitter-description").setAttribute("content", description);
  if (course.image_url) {
    document.getElementById("og-image").setAttribute("content", course.image_url);
    document.getElementById("twitter-image").setAttribute("content", course.image_url);
  }
  document.getElementById("breadcrumb-current").textContent = course.title;

  const jsonLd = {
    "@context": "https://schema.org",
    "@type": "Course",
    name: course.title,
    description: course.description,
    provider: {
      "@type": "Organization",
      name: "Formar Capacitaciones",
      sameAs: "https://instagram.com/formar.capacitaciones",
      url: SITE_URL,
    },
    hasCourseInstance: {
      "@type": "CourseInstance",
      courseMode: course.modality,
      location: course.location || "Argentina",
    },
    educationalCredentialAwarded: "Certificado con validez nacional e internacional",
    inLanguage: "es-AR",
    areaServed: ["Salta", "Córdoba", "Argentina"],
  };
  document.getElementById("course-jsonld").textContent = JSON.stringify(jsonLd);

  const breadcrumbJsonLd = {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    itemListElement: [
      { "@type": "ListItem", position: 1, name: "Inicio", item: `${SITE_URL}/` },
      { "@type": "ListItem", position: 2, name: "Cursos", item: `${SITE_URL}/cursos.html` },
      { "@type": "ListItem", position: 3, name: course.title, item: url },
    ],
  };
  document.getElementById("breadcrumb-jsonld").textContent = JSON.stringify(breadcrumbJsonLd);
}

function renderCourse(course, related) {
  const wrap = document.getElementById("course-content");
  const message = `Hola, quiero más información sobre el curso "${course.title}"`;

  wrap.innerHTML = `
    <article class="container course-detail">
      <div>
        <div class="course-hero-media">
          ${course.image_url ? `<img src="${escapeHtml(course.image_url)}" alt="${escapeHtml(course.title)}" />` : ""}
        </div>

        <div class="tag-row">
          ${course.categories?.name ? `<span class="tag tag-category">${escapeHtml(course.categories.name)}</span>` : ""}
          <span class="tag tag-modality">${escapeHtml(course.modality)}</span>
          ${course.duration ? `<span class="tag tag-duration">Duración: ${escapeHtml(course.duration)}</span>` : ""}
        </div>

        <h1>${escapeHtml(course.title)}</h1>
        ${course.location ? `<p class="course-location">📍 ${escapeHtml(course.location)}</p>` : ""}

        <p class="course-description">${escapeHtml(course.description)}</p>

        ${
          /asincr/i.test(course.modality || "")
            ? `<div class="video-wrap">
                <h2>¿Cómo se cursa?</h2>
                <p class="course-description">Este curso es <strong>online asincrónico</strong>: accedés al contenido y avanzás según tus tiempos, sin depender de un horario fijo de conexión. Podés estudiar desde donde estés, en el momento que puedas.</p>
              </div>`
            : ""
        }

        ${
          course.video_url
            ? `<div class="video-wrap">
                <h2>Video explicativo</h2>
                <div class="video-frame">
                  <iframe src="${escapeHtml(course.video_url)}" title="Video explicativo de ${escapeHtml(course.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
              </div>`
            : ""
        }

        ${
          related.length > 0
            ? `<div class="related-courses">
                <h2>Otros cursos que te pueden interesar</h2>
                <div class="related-grid">
                  ${related
                    .map(
                      (r) => `
                    <a href="curso.html?slug=${encodeURIComponent(r.slug)}" class="related-card">
                      <h4>${escapeHtml(r.title)}</h4>
                      <p>${escapeHtml(r.modality)}</p>
                    </a>`
                    )
                    .join("")}
                </div>
              </div>`
            : ""
        }
      </div>

      <aside class="sidebar-card">
        <span class="label">Inversión</span>
        <p class="price">${priceDisplay(course)}</p>
        <p class="modality-line">Modalidad: <strong>${escapeHtml(course.modality)}</strong></p>

        <a href="${whatsappLink(course.whatsapp_number || WHATSAPP_NUMBER, message)}" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp btn-block">
          ${WHATSAPP_ICON} Consultar por WhatsApp
        </a>
        <a href="https://instagram.com/formar.capacitaciones" target="_blank" rel="noopener noreferrer" class="btn btn-outline btn-block">
          Consultar por Instagram
        </a>

        <ul class="checklist">
          <li>${CHECK_ICON}<span>Certificado con validez nacional e internacional</span></li>
          <li>${CHECK_ICON}<span>Acompañamiento docente durante todo el cursado</span></li>
          <li>${CHECK_ICON}<span>Inscripción 100% online</span></li>
        </ul>
      </aside>
    </article>
  `;
}

async function init() {
  renderHeader();
  renderFooter();
  initAllAnimations();

  try {
    const content = await fetchSiteContent();
    showPrices = !!content.show_prices;
  } catch (err) {
    console.warn("No se pudo cargar site_content:", err.message || err);
  }

  const slug = getSlugFromUrl();
  const course = slug ? await fetchCourse(slug) : null;

  if (!course) {
    document.getElementById("not-found").classList.remove("hidden");
    document.getElementById("breadcrumb").classList.add("hidden");
    return;
  }

  const related = await fetchRelated(course.category_id, course.id);
  applySEO(course);
  renderCourse(course, related);
  initScrollReveal();
}

document.addEventListener("DOMContentLoaded", init);
